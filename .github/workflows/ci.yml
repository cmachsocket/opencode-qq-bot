name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # action 要解析 base / head 的 commit，浅克隆不够
          fetch-depth: 0

      # 官方 action 内部用 docker 跑 CLI；version 必须显式固定，默认是 latest。
      # base / head 显式给出，避免手动触发时两个参数为空、命令行解析出错。
      - name: 隐私扫描（自定义检测器，离线）
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          version: 3.99.8
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && format('{0}~1', github.sha) || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --config=scripts/trufflehog.yml --include-detectors=CustomRegex --no-verification

      - uses: oven-sh/setup-bun@v2
        with:
          # 与本机开发用的版本对齐，避免两边行为不一致
          bun-version: "1.4.4"

      - name: 安装依赖（冻结锁文件）
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: 格式检查
        run: bun run format:check

      # 面板前端随包分发：类型检查与构建都要过
      - name: 面板前端类型检查
        run: |
          bun install --cwd web --frozen-lockfile
          bun run web:check

      - name: 面板前端构建
        run: bun run web:build

      # 含 tests/notice.test.ts：LICENSE ↔ package.json、NOTICE 覆盖全部运行时依赖
      - name: 测试
        run: bun run test

      - name: 依赖漏洞扫描（只查运行时依赖，高危及以上）
        run: bun audit --production --audit-level=high
