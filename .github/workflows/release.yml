name: Release

on:
  push:
    # 只认 v 开头的 tag，例如 v0.5.1
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 发布门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # release:check 会看工作区状态，取完整历史便于排查
          fetch-depth: 0

      # 隐私扫描：发布的内容不能带凭证。
      # CI 的增量扫描只覆盖 push 的那一段，这里从根提交一路扫到标签，
      # 兜住「标签指向的提交没被 CI 扫过」的情况。
      - name: 隐私扫描基线（根提交）
        id: scan-base
        run: echo "commit=$(git rev-list --max-parents=0 HEAD | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: 隐私扫描（自定义检测器，离线）
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          version: 3.99.8
          base: ${{ steps.scan-base.outputs.commit }}
          head: ${{ github.sha }}
          extra_args: --config=scripts/trufflehog.yml --include-detectors=CustomRegex --no-verification

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: 安装依赖（冻结锁文件）
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: 格式检查
        run: bun run format:check

      # 面板前端随包分发：类型检查与构建都要过
      - name: 面板前端类型检查
        run: |
          bun install --cwd web --frozen-lockfile
          bun run web:check

      - name: 面板前端构建
        run: bun run web:build

      - name: 测试
        run: bun run test

      - name: 发布检查（tag 与版本 / CHANGELOG / 许可证 / NOTICE）
        run: bun scripts/release-check.ts --tag "$GITHUB_REF_NAME"

  publish:
    name: 暂存到 npm 并创建 GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # gh release create 需要写仓库；--provenance 需要 id-token
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # --provenance 是 npm 的能力，用 npm 发布而不是 bun publish
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # stage publish 需要 npm >= 11.15.0；Node 22 自带的是 10.x。
      # 固定小版本，避免 latest 漂移把发布行为改掉。
      - name: 升级 npm
        run: npm install -g npm@11.15.0

      - name: 安装依赖（冻结锁文件）
        run: bun install --frozen-lockfile

      # npm 包的 files 里带着 web/dist：前端产物必须先构建出来，否则包里没有面板页面
      - name: 构建面板前端
        run: |
          bun install --cwd web --frozen-lockfile
          bun run web:build

      # trusted publisher 只允许 stage publish：这里只把包放进暂存区，
      # 维护者用 2FA 执行 npm stage approve 之后版本才真正可安装。
      - name: 暂存到 npm（OIDC trusted publishing，无需 token）
        run: npm stage publish --provenance --access public

      # 写到 RUNNER_TEMP：在仓库里重定向会先建出未跟踪文件，触发 release-check 的脏工作区判定
      - name: 从 CHANGELOG 取 Release 正文
        run: |
          bun scripts/release-check.ts --tag "$GITHUB_REF_NAME" --notes > "$RUNNER_TEMP/notes.md"
          printf '\n> npm 包已由 CI 暂存，需维护者在 npm 侧 2FA 批准后才可安装。\n' >> "$RUNNER_TEMP/notes.md"

      - name: 创建 GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
          --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
